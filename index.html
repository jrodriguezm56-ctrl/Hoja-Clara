<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica Excel</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        *, * ::before, * ::after {
            box-sizing: border-box;
        }

        img {
            max-width: 20px;
            height: auto;
        }

        table{
            border-collapse: collapse;
        }

        thead, 
        tr td:first-child {
            background: #eee;
        }

        th, td { 
            border: 1px solid #ccc;
            font-weight: normal;
            font-size: 12px;
            text-align: center;
            width: 64px;
            height: 20px;
            vertical-align: middle;
            position: relative
        }

        /*td:focus :active{
            border-radius: 2px;
            outline: 2px solid #09f
        }*/

        span,
        input {
            position:absolute;
            inset: 0;
            vertical-align: middle;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        input{
            border: 0;
            opacity: 0;
            pointer-events: none;
            width: 100%;
            border-radius: 2px;

            &:focus {
                opacity: 1;
                outline: 2px solid #09f;
            }
        }

    </style>
    <script type="module">
        const $ = el => document.querySelector(el)
        const $$ = el => document.querySelectorAll(el)

        const $table = $('table')
            const $head = $('thead')
            const $body = $('tbody')

        const ROWS = 10
        const COLUMNS = 5
        const FIRST_CHAR_CODE = 65

        const times = length => Array.from({length }, (_, i) => i)
        const getColumn = i => String.fromCharCode(FIRST_CHAR_CODE + i)
        
        let STATE = times(COLUMNS)
            .map(i=> times(ROWS).map(j => ({computedValue: 0, value: 0 })))

        console.log(STATE)

        function updateCell ({ x, y, value }) {
            const newstate= structuredClone(STATE)
        
            const cell = newstate[x][y]
            
            cell.computedValue = computedValue(value) // span
            cell.value = value // input

            newstate [x][y] = cell

            STATE = newstate

            renderSpreadSheet()

        }

        function computedValue (value) {
            if (!value.startsWith('=')) return value

            const formula = value.slice(1)

            let computedValue 
            try { 
                computedValue = eval(formula)
            } catch (e){
                computedValue = `!ERROR: ${e.message}`
            }

            return computedValue
        }

        const renderSpreadSheet = () => {
            const headerHTML = `<tr>
                <th></th>
                ${times (COLUMNS).map(i => `<th>${getColumn(i)}</th>`).join('')}
             </tr>`

            $head.innerHTML = headerHTML
            
            const bodyHTML = times(ROWS).map(row =>{
                return `<tr>
                    <td>${row + 1}</td>
                    ${times(COLUMNS).map(column => `
                    <td data-x="${column}" data-y="${row}">
                        <span>${STATE[column][row].computedValue}</span>
                        <input type="text" value="${STATE[column][row].value}" />
                    </td>
                `).join('')}
             </tr>`
            }).join('')
             $body.innerHTML = bodyHTML
        }
        $body.addEventListener('click', event => {
            const td =event.target.closest('td')
            if (!td) return

            const {x, y} = td.dataset
            const input = td.querySelector('input')
            const span = td.querySelector('span')

            const end = input.value.length
            input.setSelectionRange( end, end)
            input.focus()

            input.addEventListener ('keydown', (event) => {
                if (event.key === 'Enter') input.blur ()
            })

            input.addEventListener('blur', () => {
                console.log({value: input.value, state: STATE[x][y].value})

                if (input.value === STATE[x][y].value) return

                updateCell({ x, y, value: input.value})
            }, { once:true })
        })

        renderSpreadSheet()
    </script>
</head>

<body>
   <img
   src="https://upload.wikimedia.org/wikipedia/commons/6/60/Microsoft_Office_Excel_%282025%E2%80%93present%29.svg?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=original" />

   <table>
    <thead></thead>
    <tbody></tbody>
   </table>
</body>

</html>
