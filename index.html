<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica Excel</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        *, * ::before, * ::after {
            box-sizing: border-box;
        }

        img {
            max-width: 20px;
            height: auto;
        }

        table{
            border-collapse: collapse;
        }

        thead, 
        tr td:first-child {
            background: #eee;
        }

        th, td { 
            border: 1px solid #ccc;
            font-weight: normal;
            font-size: 12px;
            text-align: center;
            width: 64px;
            height: 20px;
            vertical-align: middle;
        }

        input{
            border: 0;
            opacity: 0;
            pointer-events: none;
            width: 100%;

        }

    </style>
    <script type="module">
        const $ = el => document.querySelector(el)
        const $$ = el => document.querySelectorAll(el)

        const ROWS = 10
        const COLUMNS = 3

        const range = length => Array.from({length }, (_, i) => i)

        const renderSpreadSheet = () => {
            const $table = $ ('table')
            const $head = $('thead')
            const $body = $('tbody')

            const headerHTML = `<tr>
                <th></th>
                ${range (COLUMNS).map(i => `<th>${i}</th>`).join('')}
             </tr>`

            $head.innerHTML = headerHTML
            
            const bodyHTML = range(ROWS).map(row =>{
                return `<tr>
                    <td>${row + 1}</td>
                    ${range(COLUMNS).map(column => `
                    <td data-x="${column}" data-y="${row}">
                        <span></span>
                        <input type="text" value="" />
                    </td>
                `).join('')}
             </tr>`
            }).join('')
             $body.innerHTML = bodyHTML
        }

        renderSpreadSheet()
    </script>
</head>

<body>
   <img
   src="https://upload.wikimedia.org/wikipedia/commons/6/60/Microsoft_Office_Excel_%282025%E2%80%93present%29.svg?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=original" />

   <table>
    <thead></thead>
    <tbody></tbody>
   </table>
</body>

</html>
